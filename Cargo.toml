# The submodules are repositories of their own, each its own workspace: the interface of the
# plugins (`api/`), the native plugins (`plugins/<name>/`) and the documentation (`docs/`). The
# IDE is built without the plugins: they build alone, against `api` only.
[workspace]
exclude = ["api", "plugins", "docs", "test/fixtures/demo", "vendor"]

[package]
name = "atelier-ide"
version = "0.5.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/atelier-ide-org/app"
default-run = "atelier-ide"

[dependencies]
# The glow renderer, not wgpu (the default since 0.34): the native plugins paint through
# egui_glow callbacks.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "system_fonts",
    "wayland",
    "x11",
] }
# `http`: the pictures of a Markdown document that are on the web (badges, screenshots).
egui_extras = { version = "0.37", features = ["syntect", "svg", "svg_text", "image", "file", "http"] }
# Draws the SVG of a diagram (the renderer gives text, not a tree of its own resvg) and the badges
# of a README, with the fonts of the system.
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
mermaid-rs-renderer = { version = "0.3", default-features = false, features = ["png"] }
egui_commonmark = { version = "0.26", features = ["better_syntax_highlighting", "svg"] }
# The parser of egui_commonmark: where the HTML of a Markdown document is.
pulldown-cmark = { version = "0.13", default-features = false }
# The name of an installed font and whether it is monospaced.
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
vt100 = "0.18"
# The text a program of the terminal copies arrives in base64 (OSC 52).
base64 = "0.23"
anyhow = "1"
similar = "2"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# The encodings of text files other than UTF-8 (Windows-1252, Shift_JIS…).
encoding_rs = "0.8"
flate2 = "1"
quick-xml = "0.42"
tree-sitter = "0.27.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-rust = "0.24"
streaming-iterator = "0.1"
regex = "1"
# The bootstrap (`src/bin/atelier.rs`): downloads and updates the IDE.
ureq = "3"
sha2 = "0.10"
toml_edit = "0.25"
# Memory and processor use of the IDE, in the status bar.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tar = { version = "0.4", default-features = false }
# The language of the system, the default language of the interface.
sys-locale = "0.3"
tree-sitter-java = "0.23"
spellbook = "0.4.2"
# The window handle eframe gives, to place the window on Windows.
raw-window-handle = "0.6"
tree-sitter-python = "0.25"
# Native plugins: the dynamic libraries of `.atelier/plugins`, and the interface they implement.
libloading = "0.9"
# The interface of the native plugins (the submodule `api/`): C types, and the messages.
atelier-plugin-api = { path = "api", default-features = false, features = ["serde"] }
# The YAML plugin: checks a reformat kept the data, and converts YAML to JSON.
yaml-rust2 = { version = "0.13", default-features = false }

# The Web viewer: the web view of the system (WebView2, WKWebView) as a child of the window.
# Linux would need WebKitGTK and a GTK window, which eframe has not.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
wry = { version = "0.57", default-features = false, features = ["devtools"] }

[target.'cfg(windows)'.dependencies]
# Placement of the window on the monitor in use, its taskbar button, its rounded corners, its
# crash log and the files dragged out of it.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Ole",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }


[build-dependencies]
# Reads the cards of the built-in plugins (front matter of `doc/<language>.md`) into the translations.
yaml-rust2 = { version = "0.13", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Tests: only the lines in the debug information, which links faster. The optimization stays
# the one of `dev`: at opt-level 0 the tests ran two and a half times slower.
[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = true

# Crates with a change of ours (see vendor/README.md).
[patch.crates-io]
egui_commonmark_backend = { path = "vendor/egui_commonmark_backend" }
